stages:
  - build

image: "docker.vandertogt.org/firmware-builder:v1.14.0"

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  GIT_DEPTH: 0
  GCC_TOOLCHAIN_PREFIX: /opt/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi

# Build on:
# - Tags
# - Merge requests
# - Branches
workflow:
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

# The FetchContent sources (build/_deps) are cached between pipelines. The
# key is fixed: in CI, CMake checks each cached source against its declared
# tag and fetches again when the tag changes. The -build directories depend
# on the preset, so they are not cached. One job of each key pushes the
# cache; the other jobs only pull it.
.fetchcontent-cache: &fetchcontent-cache
  key: fetchcontent-firmware
  paths:
    - build/_deps/*-src
    - build/_deps/*-subbuild
  policy: pull

lint-code:
  stage: .pre
  cache: *fetchcontent-cache
  script:
    - clang-format --version
    - cmake --version
    - cd "$CI_PROJECT_DIR"
    - BUILDDIR=clangformat-build
    - cmake -S . -B "${BUILDDIR}" -G "Unix Makefiles"
    - cmake --build ${BUILDDIR} --target clangformat
    - git diff --numstat
    - linter_errors=$(git diff --numstat | wc -l)
    - if [ ! "$linter_errors" -eq "0" ]; then echo "Detected formatting issues; please fix"; git diff; exit 1; else echo "Formatting is correct"; exit 0; fi
  after_script:
    - echo "Cleanup changes made"
    - git checkout .

run-unit-tests:
  stage: .pre
  cache:
    <<: *fetchcontent-cache
    key: fetchcontent-host-tests
    policy: pull-push
  script:
    - cd "$CI_PROJECT_DIR"
    - cmake --preset host-tests -G "Unix Makefiles"
    - cmake --build --preset host-tests -- -j`nproc`
    - ctest --preset host-tests

run-tool-tests:
  stage: .pre
  script:
    - cd "$CI_PROJECT_DIR"
    - python3 -m unittest discover -s tools -p "test_*.py" -v

# Builds the application images of the board (standalone, app-8k, app-10k;
# README "Build the firmware") with the configure preset ${BOARD}${VARIANT}
# (CMakePresets.json). Release by default; a Debug build has the debug log on
# the CDC port and SWD on. The job sets VSL_STRICT_SIZE, so the linker
# script fails the link when an image does not fit; the size check reports
# the size of each image in vsl-images.txt and fails on the same limit. The
# default target also builds versaloon-bootloader for the Mini and the
# OtherUse.
.build-board-template:
  stage: build
  cache: *fetchcontent-cache
  variables:
    BUILD_TYPE: Release
    # The preset is ${BOARD}${VARIANT}. Both empty for the default personality
    VARIANT: ""
    # The image tag of the personalities (docs/development.md "Image names")
    PROTOCOL_TAG: ""
    # VSL_SKIP_IMAGES: the images that the job leaves out
    SKIP_IMAGES: ""
  script:
    - cd "$CI_PROJECT_DIR"
    - PRESET=${BOARD}${VARIANT}
    - BUILDDIR=build/${PRESET}
    - cmake --preset ${PRESET} -G "Unix Makefiles" -DVSL_STRICT_SIZE=ON "-DVSL_SKIP_IMAGES=${SKIP_IMAGES}"
    - cmake --build --preset ${PRESET} -- -j`nproc`
    - while read -r image limit; do ci/check-size.sh "${BUILDDIR}/${image}" "${limit}"; done < "${BUILDDIR}/vsl-images.txt"
  # Only the .hex and .bin files that a user writes, with the board, the
  # image, the build type and the version in the name (README "Build the
  # firmware"): standalone, app-8k, app-10k and with-bootloader. The ST-Link/V2
  # has the standalone image only. No .elf, .map or bootloader-only files.
  # A tag of a multi image has a "+": encode it as %2B in a download URL.
  artifacts:
    name: "versaloon-ng-${BOARD}${PROTOCOL_TAG}-${BUILD_TYPE}-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/${BOARD}${VARIANT}/versaloon-ng-${BOARD}*.hex
      - build/${BOARD}${VARIANT}/versaloon-ng-${BOARD}*.bin

# Only the Mini jobs run on every pipeline. The jobs of the other boards are
# manual, except on a tag, where all jobs run. A manual job allows failure,
# so it does not block the pipeline or the MR.
.manual-unless-tag:
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$BOARD == "mini"'
    - when: manual
      allow_failure: true

# The Versaloon personality of the Mini. This job updates the cache.
build-mini:
  extends: .build-board-template
  cache:
    <<: *fetchcontent-cache
    policy: pull-push
  variables:
    BOARD: mini

build-mini-debug:
  extends: .build-board-template
  variables:
    BOARD: mini
    VARIANT: -debug
    BUILD_TYPE: Debug

# The release builds of the personality sets (#79, decision Q6). Each entry
# gives the preset suffix VARIANT and the image tag PROTOCOL_TAG of one set.
build:
  extends: [.build-board-template, .manual-unless-tag]
  parallel:
    matrix:
      # VSL_PERSONALITIES=versaloon. The Mini is the build-mini job.
      - BOARD: [otheruse, stlinkv2]
      - BOARD: [mini, otheruse, stlinkv2]
        VARIANT: -cmsis-dap
        PROTOCOL_TAG: -cmsis-dap
      - BOARD: [mini, otheruse, stlinkv2]
        VARIANT: -wch-link
        PROTOCOL_TAG: -wch-link
      # VSL_PERSONALITIES=versaloon,cmsis-dap. The last 1 KB flash page holds
      # the stored personality, so each image limit of a multi image is 1 KB
      # smaller.
      - BOARD: [mini, otheruse, stlinkv2]
        VARIANT: -dual
        PROTOCOL_TAG: -vsl+dap
      # The same, with CMSIS-DAP as the default personality
      - BOARD: mini
        VARIANT: -dual-cmsis-dap
        PROTOCOL_TAG: -dap+vsl
      # VSL_PERSONALITIES=versaloon,cmsis-dap,wch-link
      - BOARD: [mini, otheruse, stlinkv2]
        VARIANT: -triple
        PROTOCOL_TAG: -vsl+dap+wch

# NUCLEO-H533RE (STM32H5, #89): all presets of the board, on every
# pipeline. The board has the standalone image only. The dual image keeps
# the last 8 KB flash sector for the stored personality. Its own cache key: the H5 builds fetch the CMSIS packages
# of the H5 and the Cortex-M33.
build-nucleoh533:
  extends: .build-board-template
  cache:
    <<: *fetchcontent-cache
    key: fetchcontent-firmware-h5
    policy: pull-push
  parallel:
    matrix:
      - BOARD: nucleoh533
        VARIANT: ""
      - BOARD: nucleoh533
        VARIANT: -cmsis-dap
        PROTOCOL_TAG: -cmsis-dap
      - BOARD: nucleoh533
        VARIANT: -dual
        PROTOCOL_TAG: -vsl+dap
      - BOARD: nucleoh533
        VARIANT: -wch-link
        PROTOCOL_TAG: -wch-link
      - BOARD: nucleoh533
        VARIANT: -debug
        BUILD_TYPE: Debug

# WeAct STM32H523 core board (STM32H523CC, 256 KB flash): the same presets
# as the NUCLEO-H533RE. It reads the H5 cache of build-nucleoh533, and only
# build-nucleoh533 writes it.
build-weacth523:
  extends: .build-board-template
  cache:
    <<: *fetchcontent-cache
    key: fetchcontent-firmware-h5
    policy: pull
  parallel:
    matrix:
      - BOARD: weacth523
        VARIANT: ""
      - BOARD: weacth523
        VARIANT: -cmsis-dap
        PROTOCOL_TAG: -cmsis-dap
      - BOARD: weacth523
        VARIANT: -dual
        PROTOCOL_TAG: -vsl+dap
      - BOARD: weacth523
        VARIANT: -wch-link
        PROTOCOL_TAG: -wch-link
      - BOARD: weacth523
        VARIANT: -debug
        BUILD_TYPE: Debug

# VSL_PERSONALITIES=cmsis-dap,wch-link, a set without Versaloon. Build and
# size check only, no artifacts.
build-mini-cmsis-dap-wch-link:
  extends: .build-board-template
  variables:
    BOARD: mini
    VARIANT: -cmsis-dap-wch-link
    PROTOCOL_TAG: -dap+wch
  artifacts: null

# VSL_PERSONALITIES=cmsis-dap with the RISC-V bridge (VSL_CMSIS_DAP_RV_BRIDGE,
# #103). Build and size check only, no artifacts.
build-mini-cmsis-dap-rv-bridge:
  extends: .build-board-template
  variables:
    BOARD: mini
    VARIANT: -cmsis-dap-rv-bridge
    PROTOCOL_TAG: -cmsis-dap-rv-bridge
  artifacts: null
