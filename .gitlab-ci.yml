stages:
  - build

image: "docker.vandertogt.org/firmware-builder:v1.14.0"

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  GIT_DEPTH: 0
  GCC_TOOLCHAIN_PREFIX: /opt/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi

# Build on:
# - Tags
# - Merge requests
# - Branches
workflow:
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

# The FetchContent sources (build/_deps) are cached between pipelines. The
# key is fixed: in CI, CMake checks each cached source against its declared
# tag and fetches again when the tag changes. The -build directories depend
# on the preset, so they are not cached. One job of each key pushes the
# cache; the other jobs only pull it.
.fetchcontent-cache: &fetchcontent-cache
  key: fetchcontent-firmware
  paths:
    - build/_deps/*-src
    - build/_deps/*-subbuild
  policy: pull

lint-code:
  stage: .pre
  cache: *fetchcontent-cache
  script:
    - clang-format --version
    - cmake --version
    - cd "$CI_PROJECT_DIR"
    - BUILDDIR=clangformat-build
    - cmake -S . -B "${BUILDDIR}" -G "Unix Makefiles"
    - cmake --build ${BUILDDIR} --target clangformat
    - git diff --numstat
    - linter_errors=$(git diff --numstat | wc -l)
    - if [ ! "$linter_errors" -eq "0" ]; then echo "Detected formatting issues; please fix"; git diff; exit 1; else echo "Formatting is correct"; exit 0; fi
  after_script:
    - echo "Cleanup changes made"
    - git checkout .

run-unit-tests:
  stage: .pre
  cache:
    <<: *fetchcontent-cache
    key: fetchcontent-host-tests
    policy: pull-push
  script:
    - cd "$CI_PROJECT_DIR"
    - cmake --preset host-tests -G "Unix Makefiles"
    - cmake --build --preset host-tests -- -j`nproc`
    - ctest --preset host-tests

run-tool-tests:
  stage: .pre
  script:
    - cd "$CI_PROJECT_DIR"
    - python3 -m unittest discover -s tools -p "test_*.py" -v

# Builds the application images of the board (standalone, app-8k, app-10k;
# README "Build the firmware") with the configure preset ${BOARD}${VARIANT}
# (CMakePresets.json). Release by default; a Debug build has the debug log on
# the CDC port and SWD on. The job sets MUPP_STRICT_SIZE, so the linker
# script fails the link when an image does not fit; the size check reports
# the size of each image in vsl-images.txt and fails on the same limit. The
# default target also builds openmupp-bootloader for the Mini and the
# ST-Link/V2 boards.
.build-board-template:
  stage: build
  cache: *fetchcontent-cache
  variables:
    BUILD_TYPE: Release
    # The preset is ${BOARD}${VARIANT}
    VARIANT: ""
    # The image tag of the personalities (docs/development.md "Image names")
    PROTOCOL_TAG: ""
    # MUPP_SKIP_IMAGES: the images that the job leaves out
    SKIP_IMAGES: ""
  script:
    - cd "$CI_PROJECT_DIR"
    - PRESET=${BOARD}${VARIANT}
    - BUILDDIR=build/${PRESET}
    - cmake --preset ${PRESET} -G "Unix Makefiles" -DMUPP_STRICT_SIZE=ON "-DMUPP_SKIP_IMAGES=${SKIP_IMAGES}"
    - cmake --build --preset ${PRESET} -- -j`nproc`
    - while read -r image limit; do ci/check-size.sh "${BUILDDIR}/${image}" "${limit}"; done < "${BUILDDIR}/vsl-images.txt"
  # Only the .hex and .bin files that a user writes, with the board, the
  # image, the build type and the version in the name (README "Build the
  # firmware"): standalone, app-8k, app-10k and with-bootloader. The ST-Link/V2
  # boards have no app-10k image. No .elf, .map or bootloader-only files.
  # A tag of a multi image has a "+": encode it as %2B in a download URL.
  artifacts:
    name: "openmupp-${BOARD}${PROTOCOL_TAG}-${BUILD_TYPE}-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/${BOARD}${VARIANT}/openmupp-${BOARD}*.hex
      - build/${BOARD}${VARIANT}/openmupp-${BOARD}*.bin

# Only the Mini jobs run on every pipeline. The jobs of the other boards are
# manual, except on a tag, where all jobs run. A manual job allows failure,
# so it does not block the pipeline or the MR.
.manual-unless-tag:
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$BOARD == "mini"'
    - when: manual
      allow_failure: true

# The CMSIS-DAP image of the Mini. This job updates the cache.
build-mini:
  extends: .build-board-template
  cache:
    <<: *fetchcontent-cache
    policy: pull-push
  variables:
    BOARD: mini
    VARIANT: -cmsis-dap
    PROTOCOL_TAG: -cmsis-dap

# The CMSIS-DAP personality with the debug log on the CDC port. Without the
# RISC-V bridge: with it, the Debug image does not fit behind a bootloader.
build-mini-debug:
  extends: .build-board-template
  variables:
    BOARD: mini
    VARIANT: -debug
    PROTOCOL_TAG: -cmsis-dap-no-rv-bridge
    BUILD_TYPE: Debug

# The release images: the CMSIS-DAP image and the multi image with the
# CMSIS-DAP and the WCH-Link personalities. Each entry gives the preset
# suffix VARIANT and the image tag PROTOCOL_TAG of one set. The CI builds no
# image with the Versaloon personality.
build:
  extends: [.build-board-template, .manual-unless-tag]
  parallel:
    matrix:
      # MUPP_PERSONALITIES=cmsis-dap. The Mini is the build-mini job.
      - BOARD: [stlinkv2, stlinkv2miniclone]
        VARIANT: -cmsis-dap
        PROTOCOL_TAG: -cmsis-dap
      # MUPP_PERSONALITIES=cmsis-dap,wch-link. The last 1 KB flash page holds
      # the stored personality, so each image limit of a multi image is 1 KB
      # smaller.
      - BOARD: [mini, stlinkv2, stlinkv2miniclone]
        VARIANT: -dual
        PROTOCOL_TAG: -dap+wch

# WeAct STM32H523 core board (STM32H5, STM32H523CC, 256 KB flash): the same
# sets, on every pipeline. The board has the standalone link image only. The
# multi image keeps the last 8 KB flash sector for the stored personality.
# Its own cache key: the H5 builds fetch the CMSIS packages of the H5 and the
# Cortex-M33.
build-weacth523:
  extends: .build-board-template
  cache:
    <<: *fetchcontent-cache
    key: fetchcontent-firmware-h5
    policy: pull-push
  parallel:
    matrix:
      - BOARD: weacth523
        VARIANT: -cmsis-dap
        PROTOCOL_TAG: -cmsis-dap
      - BOARD: weacth523
        VARIANT: -dual
        PROTOCOL_TAG: -dap+wch
      - BOARD: weacth523
        VARIANT: -debug
        PROTOCOL_TAG: -cmsis-dap
        BUILD_TYPE: Debug

# MUPP_PERSONALITIES=cmsis-dap without the RISC-V bridge
# (MUPP_CMSIS_DAP_RV_BRIDGE=OFF): the only build of the image without the
# bridge. Build and size check only, no artifacts.
build-mini-cmsis-dap-no-rv-bridge:
  extends: .build-board-template
  variables:
    BOARD: mini
    VARIANT: -cmsis-dap-no-rv-bridge
    PROTOCOL_TAG: -cmsis-dap-no-rv-bridge
  artifacts: null
