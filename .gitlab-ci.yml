stages:
  - build

image: "docker.vandertogt.org/firmware-builder:v1.14.0"

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  GIT_DEPTH: 0
  GCC_TOOLCHAIN_PREFIX: /opt/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi

# Build on:
# - Tags
# - Merge requests
# - Branches
workflow:
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

# The FetchContent sources (build/_deps) are cached between pipelines. The
# key is fixed: in CI, CMake checks each cached source against its declared
# tag and fetches again when the tag changes. The -build directories depend
# on the preset, so they are not cached. One job of each key pushes the
# cache; the other jobs only pull it.
.fetchcontent-cache: &fetchcontent-cache
  key: fetchcontent-firmware
  paths:
    - build/_deps/*-src
    - build/_deps/*-subbuild
  policy: pull

lint-code:
  stage: .pre
  cache: *fetchcontent-cache
  script:
    - clang-format --version
    - cmake --version
    - cd "$CI_PROJECT_DIR"
    - BUILDDIR=clangformat-build
    - cmake -S . -B "${BUILDDIR}" -G "Unix Makefiles"
    - cmake --build ${BUILDDIR} --target clangformat
    - git diff --numstat
    - linter_errors=$(git diff --numstat | wc -l)
    - if [ ! "$linter_errors" -eq "0" ]; then echo "Detected formatting issues; please fix"; git diff; exit 1; else echo "Formatting is correct"; exit 0; fi
  after_script:
    - echo "Cleanup changes made"
    - git checkout .

run-unit-tests:
  stage: .pre
  cache:
    <<: *fetchcontent-cache
    key: fetchcontent-host-tests
    policy: pull-push
  script:
    - cd "$CI_PROJECT_DIR"
    - cmake --preset host-tests -G "Unix Makefiles"
    - cmake --build --preset host-tests -- -j`nproc`
    - ctest --preset host-tests

run-tool-tests:
  stage: .pre
  script:
    - cd "$CI_PROJECT_DIR"
    - python3 -m unittest discover -s tools -p "test_*.py" -v

# Builds the application images of the board (standalone, app-8k, app-10k;
# README "Build the firmware") with the configure preset PRESET
# (CMakePresets.json). Release by default; a Debug build has the debug log on
# the CDC port and SWD on. The linker script fails the link
# when an image does not fit; the size check reports the size of each image
# in vsl-images.txt and fails on the same limit. The default target also
# builds versaloon-bootloader for the Mini and the OtherUse.
.build-board-template:
  stage: build
  cache: *fetchcontent-cache
  variables:
    BUILD_TYPE: Release
    # Empty for the default personality
    PROTOCOL_TAG: ""
  script:
    - cd "$CI_PROJECT_DIR"
    - BUILDDIR=build/${PRESET}
    - cmake --preset ${PRESET} -G "Unix Makefiles"
    - cmake --build --preset ${PRESET} -- -j`nproc`
    - while read -r image limit; do ci/check-size.sh "${BUILDDIR}/${image}" "${limit}"; done < "${BUILDDIR}/vsl-images.txt"
  # Only the .hex and .bin files that a user writes, with the board, the
  # image, the build type and the version in the name (README "Build the
  # firmware"): standalone, app-8k, app-10k and with-bootloader. The ST-Link/V2
  # has the standalone image only. No .elf, .map or bootloader-only files.
  artifacts:
    name: "versaloon-ng-${BOARD}${PROTOCOL_TAG}-${BUILD_TYPE}-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/${PRESET}/versaloon-ng-${BOARD}*.hex
      - build/${PRESET}/versaloon-ng-${BOARD}*.bin

# Only the Mini jobs run on every pipeline. The jobs of the other boards are
# manual, except on a tag, where all jobs run. A manual job allows failure,
# so it does not block the pipeline or the MR.
.manual-unless-tag:
  rules:
    - if: "$CI_COMMIT_TAG"
    - when: manual
      allow_failure: true

build-mini:
  extends: .build-board-template
  cache:
    <<: *fetchcontent-cache
    policy: pull-push
  variables:
    PRESET: mini
    BOARD: mini

build-otheruse:
  extends: [.build-board-template, .manual-unless-tag]
  variables:
    PRESET: otheruse
    BOARD: otheruse

build-stlinkv2:
  extends: [.build-board-template, .manual-unless-tag]
  variables:
    PRESET: stlinkv2
    BOARD: stlinkv2

build-mini-debug:
  extends: .build-board-template
  variables:
    BOARD: mini
    BUILD_TYPE: Debug
    PRESET: mini-debug

# The CMSIS-DAP personality (VSL_PROTOCOL=cmsis-dap) on all boards
.build-cmsis-dap-template:
  extends: .build-board-template
  variables:
    PROTOCOL_TAG: "-cmsis-dap"

build-mini-cmsis-dap:
  extends: .build-cmsis-dap-template
  variables:
    PRESET: mini-cmsis-dap
    BOARD: mini

build-otheruse-cmsis-dap:
  extends: [.build-cmsis-dap-template, .manual-unless-tag]
  variables:
    PRESET: otheruse-cmsis-dap
    BOARD: otheruse

build-stlinkv2-cmsis-dap:
  extends: [.build-cmsis-dap-template, .manual-unless-tag]
  variables:
    PRESET: stlinkv2-cmsis-dap
    BOARD: stlinkv2

# The dual image (VSL_PROTOCOL=dual) on all boards. The last 1 KB flash
# page holds the stored personality, so each image limit is 1 KB smaller.
.build-dual-template:
  extends: .build-board-template
  variables:
    PROTOCOL_TAG: "-dual"

build-mini-dual:
  extends: .build-dual-template
  variables:
    PRESET: mini-dual
    BOARD: mini

build-otheruse-dual:
  extends: [.build-dual-template, .manual-unless-tag]
  variables:
    PRESET: otheruse-dual
    BOARD: otheruse

build-stlinkv2-dual:
  extends: [.build-dual-template, .manual-unless-tag]
  variables:
    PRESET: stlinkv2-dual
    BOARD: stlinkv2

# The dual image with CMSIS-DAP as the default personality
build-mini-dual-cmsis-dap:
  extends: .build-dual-template
  variables:
    PRESET: mini-dual-cmsis-dap
    BOARD: mini
    PROTOCOL_TAG: "-dual-cmsis-dap"

# The WCH-Link personality (VSL_PROTOCOL=wch-link) on all boards
.build-wch-link-template:
  extends: .build-board-template
  variables:
    PROTOCOL_TAG: "-wch-link"

build-mini-wch-link:
  extends: .build-wch-link-template
  variables:
    PRESET: mini-wch-link
    BOARD: mini

build-otheruse-wch-link:
  extends: [.build-wch-link-template, .manual-unless-tag]
  variables:
    PRESET: otheruse-wch-link
    BOARD: otheruse

build-stlinkv2-wch-link:
  extends: [.build-wch-link-template, .manual-unless-tag]
  variables:
    PRESET: stlinkv2-wch-link
    BOARD: stlinkv2
