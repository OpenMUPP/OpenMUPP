#
# CH32V003 (one wire) on the RISC-V DTM bridge of the Versaloon
# cmsis-dap personality.
# WORKAREASIZE: the RAM of the CH32V003, 2 KB.

if { ![info exists CHIPNAME] } {
	set CHIPNAME ch32v003
}
if { ![info exists WORKAREASIZE] } {
	set WORKAREASIZE 0x800
}

source [file join [file dirname [info script]] ch32v-cmsis-dap-bridge.cfg]

