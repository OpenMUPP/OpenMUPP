#
# CH32V20x (two wires) on the RISC-V DTM bridge of the Versaloon
# cmsis-dap personality.
# WORKAREASIZE: the RAM of the smallest part (CH32V203x6, 10 KB).
# Set it to the RAM of the part, for example 0x10000 (64 KB) on the CH32V208.

if { ![info exists CHIPNAME] } {
	set CHIPNAME ch32v20x
}
if { ![info exists WORKAREASIZE] } {
	set WORKAREASIZE 0x2800
}

source [file join [file dirname [info script]] ch32v-cmsis-dap-bridge.cfg]

