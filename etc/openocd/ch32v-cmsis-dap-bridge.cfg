#
# Common part of the CH32V configs for the RISC-V DTM bridge of the
# Versaloon cmsis-dap personality (docs/cmsis-dap.md, "RISC-V DTM bridge").
# The target configs set CHIPNAME and WORKAREASIZE, then source this file.

adapter driver cmsis-dap
# Newer OpenOCD has "adapter usb vid_pid" in place of "cmsis-dap vid_pid".
if {[catch {adapter usb vid_pid 0x0403 0x9b3c}]} {
	cmsis-dap vid_pid 0x0403 0x9b3c
}
transport select jtag
# Sets only the TCK of the board port. The wire has its own clock.
adapter speed 1000

# Replaces the proc of src/jtag/startup.tcl: the bridge must be on before the
# chain scan. "init" calls this proc after the adapter is open. The auto mode
# of the bridge would also find the target, but "on" skips the detection.
proc jtag_init {} {
	# ID_DAP_Vendor1: 0x81 0x01 switches the bridge on.
	if {[catch {cmsis-dap cmd 0x81 0x01}]} {
		error "The probe has no RISC-V bridge. Flash an image with VSL_CMSIS_DAP_RV_BRIDGE."
	}
	# Closing libusb is no USB reset: at shutdown, set auto (0x81 0x02), then
	# the stored mode (0x81 0x03), the mode after a USB reset. Else the next
	# plain JTAG session finds the emulated TAP. A firmware without the
	# stored mode refuses 0x03 and stays in auto. Auto keeps the port, so it
	# adds no pin activity. An error before the server loop skips this.
	lappend ::pre_shutdown_commands {catch {cmsis-dap cmd 0x81 0x02}} {catch {cmsis-dap cmd 0x81 0x03}}
	if {[catch {jtag arp_init} err] != 0} {
		init_reset startup
	}
}

jtag newtap $CHIPNAME cpu -irlen 5 -expected-id 0x15653101

set _TARGETNAME $CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $WORKAREASIZE -work-area-backup 0
