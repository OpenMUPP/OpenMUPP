#
# CH32V002/4/5/6/7 (CH32V00X, one wire) on the RISC-V DTM bridge of the Versaloon
# cmsis-dap personality.
# WORKAREASIZE: the RAM of the smallest part (CH32V002, 4 KB).
# Set it to the RAM of the part, for example 0x2000 (8 KB) on the CH32V006.

if { ![info exists CHIPNAME] } {
	set CHIPNAME ch32v00x
}
if { ![info exists WORKAREASIZE] } {
	set WORKAREASIZE 0x1000
}

source [file join [file dirname [info script]] ch32v-cmsis-dap-bridge.cfg]

# The CH32V006 refuses the program buffer (cmderr 2).
riscv set_mem_access abstract
