# avrdude programmer entry for OpenMUPP (docs/avr.md).
# Use: avrdude -C +etc/avrdude-openmupp.conf -c openmupp -p m328p -P usb
# The "+" makes avrdude read this file after its own avrdude.conf.
# The probe must have the AVR commands (MUPP_CMSIS_DAP_AVR).

programmer
    id = "openmupp";
    desc = "OpenMUPP CMSIS-DAP, AVR ISP";
    type = "jtagice3_isp";
    prog_modes = PM_ISP;
    connection_type = usb;
    # The test ID of pid.codes, until the project has its own ID
    usbvid = 0x1209;
    usbpid = 0x0001;
;
