# avrdude programmer entry for OpenMUPP (docs/avr.md).
# Use: avrdude -C +etc/avrdude-openmupp.conf -c openmupp -p m328p -P usb -B 2MHz
# debugWIRE: avrdude -C +etc/avrdude-openmupp.conf -c openmupp_dw -p m328p -P usb -D -U flash:w:firmware.hex:i
# JTAG: avrdude -C +etc/avrdude-openmupp.conf -c openmupp_jtag -p m32u4 -P usb -U flash:w:firmware.hex:i
# The "+" makes avrdude read this file after its own avrdude.conf.
# The probe must have the AVR commands (MUPP_CMSIS_DAP_AVR).

programmer
    id = "openmupp";
    desc = "OpenMUPP CMSIS-DAP, AVR ISP";
    type = "jtagice3_isp";
    prog_modes = PM_ISP;
    connection_type = usb;
    # The test ID of pid.codes, until the project has its own ID
    usbvid = 0x1209;
    usbpid = 0x0001;
;

programmer
    id = "openmupp_dw";
    desc = "OpenMUPP CMSIS-DAP, AVR debugWIRE";
    type = "jtagice3_dw";
    prog_modes = PM_debugWIRE;
    connection_type = usb;
    usbvid = 0x1209;
    usbpid = 0x0001;
;

programmer
    id = "openmupp_jtag";
    desc = "OpenMUPP CMSIS-DAP, AVR JTAG";
    type = "jtagice3";
    # PM_JTAG: avrdude reads -x jtagchain only with it (the probe accepts
    # one device only)
    prog_modes = PM_JTAG;
    # The probe sets the JTAG clock: -B without a warning
    extra_features = HAS_BITCLOCK_ADJ;
    connection_type = usb;
    usbvid = 0x1209;
    usbpid = 0x0001;
;
