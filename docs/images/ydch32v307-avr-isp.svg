<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<rect width="760" height="420" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="bold" fill="#263238">AVR ISP: 6-pin ICSP header to the YD-CH32V307VCT6</text>
<text x="30" y="64" font-size="14" fill="#546e7a">Top view of the target header. Pin 1 has the square pad. 3.3 V targets only. The target needs its own supply.</text>
<rect x="304" y="90" width="152" height="220" rx="6" fill="#212121" stroke="#9e9e9e" stroke-width="2"/>
<rect x="325" y="115" width="30" height="30" fill="#d4af37" stroke="#8d6e1f" stroke-width="2"/>
<text x="340" y="136" font-size="16" font-weight="bold" fill="#212121" text-anchor="middle">1</text>
<line x1="325" y1="130" x2="284" y2="130" stroke="#90a4ae" stroke-width="2"/>
<rect x="194" y="114" width="90" height="32" rx="6" fill="#d81b60"/>
<text x="239" y="136" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">MISO</text>
<text x="182" y="128" font-size="16" font-weight="bold" fill="#263238" text-anchor="end">PB14</text>
<text x="182" y="146" font-size="13" fill="#546e7a" text-anchor="end">P3-44</text>
<circle cx="420" cy="130" r="15" fill="#d4af37" stroke="#8d6e1f" stroke-width="2"/>
<text x="420" y="136" font-size="16" font-weight="bold" fill="#212121" text-anchor="middle">2</text>
<line x1="435" y1="130" x2="476" y2="130" stroke="#90a4ae" stroke-width="2"/>
<rect x="476" y="114" width="90" height="32" rx="6" fill="#ef6c00"/>
<text x="521" y="136" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">VCC</text>
<text x="578" y="128" font-size="16" font-weight="bold" fill="#263238">PB0</text>
<text x="578" y="146" font-size="13" fill="#546e7a">P2-29</text>
<circle cx="340" cy="200" r="15" fill="#d4af37" stroke="#8d6e1f" stroke-width="2"/>
<text x="340" y="206" font-size="16" font-weight="bold" fill="#212121" text-anchor="middle">3</text>
<line x1="325" y1="200" x2="284" y2="200" stroke="#90a4ae" stroke-width="2"/>
<rect x="194" y="184" width="90" height="32" rx="6" fill="#d81b60"/>
<text x="239" y="206" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">SCK</text>
<text x="182" y="198" font-size="16" font-weight="bold" fill="#263238" text-anchor="end">PB13</text>
<text x="182" y="216" font-size="13" fill="#546e7a" text-anchor="end">P3-45</text>
<circle cx="420" cy="200" r="15" fill="#d4af37" stroke="#8d6e1f" stroke-width="2"/>
<text x="420" y="206" font-size="16" font-weight="bold" fill="#212121" text-anchor="middle">4</text>
<line x1="435" y1="200" x2="476" y2="200" stroke="#90a4ae" stroke-width="2"/>
<rect x="476" y="184" width="90" height="32" rx="6" fill="#d81b60"/>
<text x="521" y="206" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">MOSI</text>
<text x="578" y="198" font-size="16" font-weight="bold" fill="#263238">PB15</text>
<text x="578" y="216" font-size="13" fill="#546e7a">P3-43</text>
<circle cx="340" cy="270" r="15" fill="#d4af37" stroke="#8d6e1f" stroke-width="2"/>
<text x="340" y="276" font-size="16" font-weight="bold" fill="#212121" text-anchor="middle">5</text>
<line x1="325" y1="270" x2="284" y2="270" stroke="#90a4ae" stroke-width="2"/>
<rect x="194" y="254" width="90" height="32" rx="6" fill="#d81b60"/>
<text x="239" y="276" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">RESET</text>
<text x="182" y="268" font-size="16" font-weight="bold" fill="#263238" text-anchor="end">PB12</text>
<text x="182" y="286" font-size="13" fill="#546e7a" text-anchor="end">P3-46</text>
<circle cx="420" cy="270" r="15" fill="#d4af37" stroke="#8d6e1f" stroke-width="2"/>
<text x="420" y="276" font-size="16" font-weight="bold" fill="#212121" text-anchor="middle">6</text>
<line x1="435" y1="270" x2="476" y2="270" stroke="#90a4ae" stroke-width="2"/>
<rect x="476" y="254" width="90" height="32" rx="6" fill="#263238"/>
<text x="521" y="276" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">GND</text>
<text x="578" y="268" font-size="16" font-weight="bold" fill="#263238">GND</text>
<text x="578" y="286" font-size="13" fill="#546e7a">any GND pin</text>
<text x="30" y="346" font-size="14" fill="#263238">• Probe pin (bold) and YD header pin (grey) next to each ICSP pin.</text>
<text x="30" y="370" font-size="14" fill="#263238">• VCC goes to PB0 only: the probe measures the target voltage there (3.3 V maximum).</text>
<text x="30" y="394" font-size="14" fill="#263238">• RESET is open-drain. The AVR has an internal pull-up on RESET.</text>
</svg>
